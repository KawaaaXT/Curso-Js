<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Verificador de idade</title>
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <main>
    <section>
        <div>
            <p>
                Ano de nascimento: 
                <input type="number" name="nasc" id="anonasc" placeholder="Digite o seu ano de nascimento">
            </p>
            
            <p>
                Sexo:
                <input type="radio" name="sexx" id="sexo" checked>
                <label for="sexo">Masculino</label>
                <input type="radio" name="sexx" id="sexo-fem" >
                <label for="sexo-fem">Feminino</label>
            </p>

            <p>
                <input type="button" value="Verificar" id="verificador">
            </p>

        </div>

        <div id="resultado">
            Preencha os dado a cima , para poder saber o resultado
        </div>



    </section>
    

    <script src="scrip.js"></script>

    </main>
</body>
</html>
